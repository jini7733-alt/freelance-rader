name: Build Freelance Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip -o FreelanceRadar_Mobile_APK_Build.zip -d android-project

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-project
        run: gradle :app:assembleDebug

      - name: Prepare APK
        run: |
          cp android-project/app/build/outputs/apk/debug/app-debug.apk FreelanceRadar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreelanceRadar-APK
          path: FreelanceRadar.apk
